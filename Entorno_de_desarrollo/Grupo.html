<!DOCTYPE html>
<html>
<head>
<style> 
.imgtransition {
  width: 50px;
  height: 50px;
  background-color: red;
  transition: width 1s, height 1s, background-color 3s;
}

.imgtransition:hover {
  width: 150px;
  height: 150px;
  background-color: orange;
}
</style>
</head>
<body>
<img class="imgtransition" src="descarga.jpg" alt="">

<div></div>

</body>
</html>
