<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>2) Dos columnas 50/50</title>
<style>
  .c1{background:#1E88E5;color:#fff}
  .c2{background:#43A047;color:#fff}
  .c3{background:#F4511E;color:#fff}
  .c4{background:#8E24AA;color:#fff}
  .c5{background:#FDD835;color:#333}
  .c6{background:#546E7A;color:#fff}
  .box{
    padding:20px;
    border-radius:8px;
    text-align:center;
    box-sizing:border-box;
    }

  body{
    margin:0;
    font-family:Arial,Helvetica,sans-serif;
    background:#f4f6f9}
  
  .wrap{
    width:92%;
    max-width:1100px;
    margin: 24px auto;
    margin-bottom: 48px auto;
}

  .contenedor::after{content:"";display:block;clear:both}
  .col{
    float:left;width:100%;height:200px;
    margin-bottom: 24px;
    }
</style>
</head>
<body>
  <div class="wrap contenedor">
    <div class="box c3 col" style="margin-right:23%;">Columna 1 (50%)</div>
    <div class="box c1 col">Columna 2 (50%)</div>
      <div class="box c2 col">Columna 2 (50%)</div>
  </div>
</body>
</html>
